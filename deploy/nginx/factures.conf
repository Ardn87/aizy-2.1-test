# Exemple de configuration Nginx pour un serveur Linux.
# A adapter :
# - remplacer factures.example.com par le vrai domaine ;
# - remplacer /srv/factcheck par le chemin du projet sur le serveur ;
# - renseigner les chemins des certificats HTTPS.

server {
    listen 80;
    server_name factures.example.com;

    # Redirection HTTPS a activer quand le certificat est pret.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name factures.example.com;

    ssl_certificate /etc/letsencrypt/live/factures.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/factures.example.com/privkey.pem;

    client_max_body_size 25m;

    location /static/ {
        alias /srv/factcheck/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Ne pas ajouter de bloc location /media/.
    # Les factures et bons de livraison sont sensibles et doivent rester servis
    # par les vues Django protegees :
    #   /factures/<id>/fichier/
    #   /bons-livraison/<id>/fichier/

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
